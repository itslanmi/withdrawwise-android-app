name: Release

# Push a tag such as v1.0.0 to build a minified release APK and attach it to a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # Optional signing: add RELEASE_KEYSTORE_BASE64, RELEASE_KEYSTORE_PASSWORD, RELEASE_KEY_ALIAS and
      # RELEASE_KEY_PASSWORD as repository secrets. Without them the APK is signed with a debug key.
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build release APK
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          WW_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          WW_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          WW_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          WW_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "WithdrawWise-${GITHUB_REF_NAME}.apk"

      - uses: softprops/action-gh-release@v2
        with:
          files: WithdrawWise-${{ github.ref_name }}.apk
          generate_release_notes: true
